<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Soma icon">
    <style><![CDATA[
    /* 1 Tokens + state machine: hover flips exactly one variable */
    @property --brand { syntax: "<color>"; inherits: true; initial-value: #000; } /* registered so it can transition */
    svg {
      --bg: #f5f5f7; --ink: #1d1d1f; --accent: #0071e3;
      --brand: var(--ink);
      &:hover { --brand: var(--accent); }
    }

    /* 2 Canvas + sheet. The sheet is the style root: every shape inherits
       its ink via the cascade; parts below declare only their deltas. */
    #bg { fill: var(--bg); }
    #sheet {
      fill: none; stroke: var(--ink); stroke-width: 26;
      stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 10px 28px color-mix(in srgb, var(--ink) 14%, transparent));
    }

    /* 3 Parts: the S / O / MA letters subscribe to --brand */
    #s, #lines { stroke-width: 22; }
    #s, #o { stroke: var(--brand); }
    #ma { fill: var(--brand); stroke: none; font: 800 112px 'Trebuchet MS', Verdana, 'Noto Sans', 'DejaVu Sans', sans-serif; }
    #handle { stroke-width: 24; }
    #play { fill: var(--accent); stroke-width: 14; transform-box: fill-box; transform-origin: center; }

    /* 4 Magnifier component: authored around its lens at (0 0) and placed by
       one translate, so hover scale/rotate pivots on the lens for free.
       State lives here, outside the motion gate, so it survives reduced motion. */
    #magnifier {
      translate: 483px 413px;
      svg:hover & { transform: scale(1.06) rotate(-4deg); }
    }

    /* 5 Motion: progressive enhancement only */
    @media (prefers-reduced-motion: no-preference) {
      svg { transition: --brand .3s; }
      #play { transition: transform .3s; }
      #magnifier { transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
      svg:hover #play { animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.12); } } /* 0%/100% omitted = base state */
    }
  ]]></style>

    <rect id="bg" width="100%" height="100%"/>

    <g id="sheet">
        <!-- document body with a folded top-right corner, then the crease -->
        <path d="M175 95 H660 L862 290 V855 A50 50 0 0 1 812 905 H175 A50 50 0 0 1 125 855 V145 A50 50 0 0 1 175 95 Z"/>
        <path d="M662 97 V262 A28 28 0 0 0 690 290 H860"/>

        <!-- S: integral-shaped stroke; three text lines as one multi-subpath path -->
        <path id="s" d="M300 182 C262 182 260 214 260 253 V391 C260 431 240 445 222 431 C210 420 208 399 214 384"/>
        <path id="lines" d="M222 535 h96 M222 640 h306 M222 745 h248"/>

        <!-- magnifier in lens-local coords; paint order: handle, rim, play -->
        <g id="magnifier">
            <rect id="handle" x="117" y="111" width="72" height="142" rx="32" transform="rotate(-45 153 182)"/>
            <circle id="o" r="158"/>
            <path id="play" d="M-41 -70 L79 0 L-41 70 Z"/>
        </g>

        <text id="ma" x="620" y="837">MA</text>
    </g>
</svg>
