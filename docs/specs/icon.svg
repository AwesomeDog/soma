<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Soma icon">
    <!-- Emerald organic: an S-shaped neuron drawn with organic curves — dendrites -> soma -> axon.
         Geometry is the 100-unit source scaled x10, then inset ~8% so the tips clear the canvas edge. -->
    <g transform="translate(500 500) scale(.84) translate(-500 -510)" fill="none" stroke-linecap="round">
        <!-- trunk -->
        <path d="M700 200 Q580 120 460 180 Q340 240 340 340 Q340 440 500 500 Q660 560 660 660 Q660 760 540 820 Q420 880 300 800"
              stroke="#059669" stroke-width="32"/>

        <!-- primary branches -->
        <g stroke="#059669" stroke-width="22">
            <path d="M700 200 Q780 140 840 120"/>
            <path d="M340 340 Q260 300 200 240"/>
            <path d="M660 660 Q740 700 800 760"/>
            <path d="M300 800 Q220 840 180 900"/>
        </g>

        <!-- secondary twigs -->
        <g stroke="#10B981" stroke-width="18">
            <path d="M840 120 Q880 80 920 60"/>
            <path d="M200 240 Q160 200 140 140"/>
            <path d="M200 240 Q140 260 80 240"/>
            <path d="M800 760 Q860 780 900 840"/>
            <path d="M800 760 Q840 700 900 680"/>
            <path d="M180 900 Q140 940 100 960"/>
        </g>

        <!-- nodes along the trunk -->
        <g fill="#10B981" stroke="none">
            <circle cx="460" cy="180" r="25"/>
            <circle cx="340" cy="340" r="25"/>
            <circle cx="660" cy="660" r="25"/>
            <circle cx="540" cy="820" r="25"/>
        </g>

        <!-- terminal nodes -->
        <g fill="#34D399" stroke="none">
            <circle cx="920" cy="60" r="22"/>
            <circle cx="140" cy="140" r="22"/>
            <circle cx="80" cy="240" r="22"/>
            <circle cx="900" cy="840" r="22"/>
            <circle cx="900" cy="680" r="22"/>
            <circle cx="100" cy="960" r="22"/>
            <circle cx="700" cy="200" r="26"/>
            <circle cx="300" cy="800" r="26"/>
        </g>

        <!-- soma -->
        <circle cx="500" cy="500" r="100" fill="#047857" stroke="none"/>
        <circle cx="500" cy="500" r="45" fill="#6EE7B7" stroke="none"/>
    </g>
</svg>
